---
layout: default
lang: en
title: Blog
permalink: /en/blog/
---

<h1>Blog</h1>
<ul>
  {% assign posts = site.posts | where: "lang", "en" %}
  {% for post in posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span>{{ post.date | date: "%d %B %Y" }}</span>
    </li>
  {% endfor %}
</ul>
