---
layout: default
lang: pt
title: Blog
permalink: /pt/blog/
---

<h1>Blog</h1>
<ul>
  {% assign posts = site.posts | where: "lang", "pt" %}
  {% for post in posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span>{{ post.date | date: "%d/%m/%Y" }}</span>
    </li>
  {% endfor %}
</ul>
