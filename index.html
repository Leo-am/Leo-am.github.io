<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <script>
      (function () {
        const lang = navigator.language || navigator.userLanguage;
        if (lang.startsWith('pt')) {
          window.location.replace('/pt/');
        } else {
          window.location.replace('/en/');
        }
      })();
    </script>
    <noscript>
      <p>Please enable JavaScript to view the site properly.</p>
    </noscript>
  </body>
</html>
